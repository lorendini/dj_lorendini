<!doctype html>
<html lang="it">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Contatta Lorendini — Richiesta evento</title>
 <meta name="description" content="Contatta Lorendini per il tuo evento. Scegli se scrivermi su WhatsApp o via email per raccontarmi cosa hai in mente.">
 <meta name="theme-color" content="#11110f">
 <link rel="preload" as="image" href="../assets/beach-sunset.jpg">
 <link rel="stylesheet" href="../style.css">
 <style>
  .request-page{min-height:100svh;position:relative;display:grid;place-items:center;padding:110px 7vw 70px;color:#fff;text-align:center;overflow:hidden}
  .request-page::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.28)),url('../assets/beach-sunset.jpg') center/cover}
  .request-content{position:relative;z-index:1;max-width:680px}
  .request-content h1{font-size:clamp(48px,8vw,86px);font-weight:300;line-height:.98;margin:0 0 24px}
  .request-content>p:not(.eyebrow){font-size:17px;line-height:1.65;max-width:570px;margin:0 auto}
  .request-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:34px}
  .request-actions .button{min-width:190px;justify-content:center}
  .request-back{display:inline-block;margin-top:38px;color:#fff;font-size:10px;letter-spacing:.13em;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px}
  @media(max-width:560px){.request-page{padding-inline:6vw}.request-actions{flex-direction:column;align-items:stretch}.request-actions .button{width:100%}}
 </style>
</head>
<body>
 <main class="request-page">
  <div class="request-content">
   <p class="eyebrow">LORENDINI · DJ &amp; MUSIC SELECTOR</p>
   <h1>Parliamo<br>del tuo evento.</h1>
   <p>Scrivimi la data, la location e che tipo di serata stai organizzando. Ti rispondo personalmente: scegli il canale che preferisci.</p>
   <div class="request-actions">
    <a class="button light" href="https://wa.me/393335983446" target="_blank" rel="noopener">Scrivimi su WhatsApp <span>↗</span></a>
    <a class="button outline-light" href="mailto:lorenzocardini@hotmail.it?subject=Richiesta%20informazioni%20evento">Scrivimi via email <span>↗</span></a>
   </div>
   <a class="request-back" href="/">Torna al sito</a>
  </div>
 </main>
</body>
</html>
